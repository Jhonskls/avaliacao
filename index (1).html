<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Veltrix | Sua opinião · Tu opinión · Your opinion</title>
<style>
  :root { --navy:#0b1f3a; --gold:#c9a24b; --text:#f4f1e8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--navy);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .card { max-width:360px; width:100%; }
  h1 { color: var(--gold); font-size:28px; letter-spacing:2px; margin:0 0 8px; }
  p  { margin:0 0 24px; opacity:.85; font-family: Arial, sans-serif; font-size:15px; }
  a.btn {
    display:block; margin:10px 0; padding:14px;
    border:1px solid var(--gold); border-radius:10px;
    color: var(--gold); text-decoration:none;
    font-family: Arial, sans-serif; font-size:16px;
  }
  a.btn:active { background: var(--gold); color: var(--navy); }
</style>
</head>
<body>
  <div class="card">
    <h1>VELTRIX</h1>
    <p id="msg">...</p>
    <a class="btn" id="b-pt" href="#">Português</a>
    <a class="btn" id="b-es" href="#">Español</a>
    <a class="btn" id="b-en" href="#">English</a>
  </div>

<script>
  // Links dos formulários (preenchidos automaticamente pelo script)
  var URLS = {
    pt: "https://docs.google.com/forms/d/e/1FAIpQLSfJ1ymOrb1Rq2Z6xGdtE_lViXyBHnPEfGt2IOstQLVPVj2qQA/viewform",
    es: "https://docs.google.com/forms/d/e/1FAIpQLSc-glxuHswrHDL969ClDZZMbWiocAeu3Fh1gwX9Nddhn-6GTA/viewform",
    en: "https://docs.google.com/forms/d/e/1FAIpQLSd9m6gl5-y4UmNmcWTbGC8PTxYf5vy6IkTWELdEg7GvFKKQQQ/viewform"
  };

  var MSG = {
    pt: "Abrindo o formulário...",
    es: "Abriendo el formulario...",
    en: "Opening the form..."
  };

  // Idioma: ?l=pt | ?l=es | ?l=en força o idioma. Senão, usa o do celular.
  function detectar() {
    var forcado = (new URLSearchParams(location.search).get("l") || "").toLowerCase();
    if (URLS[forcado]) return forcado;

    var l = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
    if (l.indexOf("pt") === 0) return "pt";
    if (l.indexOf("es") === 0) return "es";
    return "en";
  }

  var lang = detectar();
  ["pt", "es", "en"].forEach(function (x) {
    document.getElementById("b-" + x).href = URLS[x];
  });
  document.documentElement.lang = lang;
  document.getElementById("msg").textContent = MSG[lang];

  // Só redireciona se o link já foi configurado
  if (URLS[lang].indexOf("http") === 0) {
    location.replace(URLS[lang]);
  } else {
    document.getElementById("msg").textContent = "Configure os links no arquivo index.html";
  }
</script>
</body>
</html>
